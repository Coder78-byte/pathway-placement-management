services:
  mysql:
    image: mysql:8.4
    container_name: placement-mysql
    restart: unless-stopped
    environment:
      MYSQL_DATABASE: placement_management
      MYSQL_USER: ${DB_USERNAME:-placement}
      MYSQL_PASSWORD: ${DB_PASSWORD:-placement}
      MYSQL_ROOT_PASSWORD: ${MYSQL_ROOT_PASSWORD:-local-root-change-me}
    ports:
      - "3306:3306"
    volumes:
      - placement_mysql_data:/var/lib/mysql
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost", "-p${MYSQL_ROOT_PASSWORD:-local-root-change-me}"]
      interval: 5s
      timeout: 5s
      retries: 20
volumes:
  placement_mysql_data:
